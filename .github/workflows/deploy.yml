name: Deploy

# Durante la migración, publicar requiere un disparo manual y CI verde
# sobre el mismo commit. No desplegar automáticamente al mergear.
on:
  workflow_dispatch: # permite dispararlo a mano desde la pestaña Actions

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  checks:
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/ci.yml

  build-and-push:
    needs: checks
    if: github.ref == 'refs/heads/main'
    name: Build & push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login a GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/botclo:latest
            ghcr.io/${{ github.repository_owner }}/botclo:${{ github.sha }}
          # Las NEXT_PUBLIC_* se hornean en el build → van como build args.
          build-args: |
            NEXT_PUBLIC_APP_URL=https://botclo.com
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.CLERK_PUBLISHABLE_KEY }}

  deploy:
    name: Deploy al VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      packages: read
      contents: read
    steps:
      - name: ¿Hay acceso SSH configurado?
        id: guard
        env:
          HOST: ${{ secrets.VPS_HOST }}
        run: |
          if [ -n "$HOST" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; echo "⏭️  Falta VPS_HOST — se omite el deploy por SSH (la imagen igual quedó en GHCR)."; fi

      - name: Pull + up en el VPS (solo proyecto botclo)
        if: steps.guard.outputs.ok == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -eu
            cd /docker/botclo
            printf '%s' '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
            cat > docker-compose.release.yml <<'RELEASE'
            services:
              web:
                image: ghcr.io/${{ github.repository_owner }}/botclo:${{ github.sha }}
                environment:
                  BOT_NATIVE_PROTECTION_ENABLED: "false"
            RELEASE
            docker compose -f docker-compose.vps.yml -f docker-compose.release.yml pull web
            docker compose -f docker-compose.vps.yml -f docker-compose.release.yml up -d --no-deps web
            # Se conservan las imágenes anteriores para rollback.
