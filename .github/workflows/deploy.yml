name: Deploy

# Durante la migración, publicar requiere un disparo manual y CI verde
# sobre el mismo commit. No desplegar automáticamente al mergear.
on:
  workflow_dispatch: # permite dispararlo a mano desde la pestaña Actions

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  checks:
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/ci.yml

  build-and-push:
    needs: checks
    if: github.ref == 'refs/heads/main'
    name: Build & push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Verificar deploy selectivo de Coolify (offline)
        run: python3 -m unittest discover -s tests -p 'test_deploy_coolify.py' -v

      - uses: docker/setup-buildx-action@v3

      - name: Login a GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/botclo:latest
            ghcr.io/${{ github.repository_owner }}/botclo:${{ github.sha }}
          # Las NEXT_PUBLIC_* se hornean en el build → van como build args.
          build-args: |
            NEXT_PUBLIC_APP_URL=https://botclo.com
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.CLERK_PUBLISHABLE_KEY }}

  deploy:
    name: Deploy al VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      packages: read
      contents: read
    steps:
      - name: Validar acceso SSH configurado
        env:
          HOST: ${{ secrets.VPS_HOST }}
          SSH_USER: ${{ secrets.VPS_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          test -n "$HOST" || { echo "Falta VPS_HOST: deploy cancelado."; exit 1; }
          test -n "$SSH_USER" || { echo "Falta VPS_USER: deploy cancelado."; exit 1; }
          test -n "$SSH_PRIVATE_KEY" || { echo "Falta VPS_SSH_KEY: deploy cancelado."; exit 1; }

      - name: Publicar imagen local y actualizar solo web en Coolify
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -eu
            printf '%s' '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
            source_image='ghcr.io/${{ github.repository_owner }}/botclo:${{ github.sha }}'
            release_image='127.0.0.1:5000/migration/botclo-web:${{ github.sha }}'
            docker pull "$source_image"
            docker tag "$source_image" "$release_image"
            docker push "$release_image"
            umask 077
            mkdir -p /data/migration
            helper='/data/migration/deploy-coolify-${{ github.sha }}.py'
            curl --fail --silent --show-error --location \
              'https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/scripts/deploy-coolify.py' \
              --output "$helper"
            python3 "$helper" "$release_image"
            # Coolify conserva la configuración y las dependencias del stack.
